name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamemind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gamemind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chromadb:
        image: chromadb/chroma:0.5.23
        ports: ["8000:8000"]
    defaults:
      run:
        working-directory: backend
    env:
      GAMEMIND_TESTING: "1"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gamemind_test
      CHROMA_HOST: localhost
      CHROMA_PORT: 8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: curl --retry 15 --retry-connrefused --fail http://localhost:8000/api/v2/heartbeat
      - run: alembic upgrade head
      - name: Run API readiness smoke
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8098 > /tmp/gamemind-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python -m app.scripts.production_smoke \
            --base-url http://127.0.0.1:8098 \
            --attempts 30 \
            --retry-delay 1
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose topology
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
